name: FPF Sync Monitor

on:
  schedule:
    # Daily sentinel, offset from the worker's 05:17/17:17 slots. sync-fpf.yml
    # runs on its own schedule and completes the whole sync in one run; this
    # workflow is the independent SLO alarm and re-dispatches the worker if a
    # scheduled sync failed or never ran.
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      max_drift_hours:
        description: 'Allowed upstream-to-mcp.fpf.sh drift before this monitor fails'
        required: false
        default: '26'

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: fpf-sync-monitor
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.5'
  FPF_SYNC_MONITOR_STATUS_URL: https://mcp.fpf.sh/api/fpf/status
  # 26h = the "≤1 day behind" promise plus build/deploy slack. With twice-daily
  # worker slots the normal worst case is ~13h, so a breach means the worker is
  # actually broken, not merely scheduled later.
  FPF_SYNC_MONITOR_MAX_DRIFT_HOURS: ${{ github.event.inputs.max_drift_hours || '26' }}

jobs:
  monitor:
    name: Check mcp.fpf.sh sync SLO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Evaluate hosted sync health
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run monitor:sync -- --format markdown

      - name: Check for existing target sync PR
        id: open_sync_pr
        if: steps.monitor.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          TARGET_BRANCH: chore/sync-fpf-${{ steps.monitor.outputs.upstream_short_ref }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(
            gh pr list \
              --state open \
              --head "$TARGET_BRANCH" \
              --json number,author,baseRefName,body,headRepositoryOwner,isCrossRepository |
            jq -r --arg owner "$REPO_OWNER" '
              [
                .[]
                | select(.baseRefName == "main")
                | select(.isCrossRepository == false)
                | select(.headRepositoryOwner.login == $owner)
                | select(.author.login == "app/github-actions")
                | select((.body // "") | contains("Generated by `.github/workflows/sync-fpf.yml`."))
              ]
              | first
              | .number // empty
            '
          )"

          if [ -n "$PR_NUMBER" ]; then
            echo "target_exists=true" >> "$GITHUB_OUTPUT"
            echo "Sync PR #$PR_NUMBER already exists for $TARGET_BRANCH; a worker retry can recheck merge eligibility."
          else
            echo "target_exists=false" >> "$GITHUB_OUTPUT"
            echo "No automation-owned open sync PR exists for $TARGET_BRANCH."
          fi

      - name: Check for active sync worker
        id: active_sync_worker
        if: steps.monitor.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ACTIVE_RUN="$(
            gh run list \
              --workflow sync-fpf.yml \
              --limit 20 \
              --json databaseId,status,url |
            jq -r '
              [
                .[]
                | select(
                  .status == "queued"
                  or .status == "in_progress"
                  or .status == "waiting"
                  or .status == "pending"
                  or .status == "requested"
                )
              ]
              | first
              | if . == null then "" else "\(.databaseId)\t\(.status)\t\(.url)" end
            '
          )"

          if [ -n "$ACTIVE_RUN" ]; then
            IFS=$'\t' read -r run_id run_status run_url <<< "$ACTIVE_RUN"
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Sync worker run $run_id is $run_status: $run_url"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No active sync worker run found; dispatch can open or retry the current sync PR."
          fi

      # CR-3 stop-retry ledger: run-listing APIs cannot recover dispatch inputs,
      # so a per-ref open issue IS the durable attempt counter. A new upstream
      # ref gets a fresh title (short ref in it) and therefore a fresh counter.
      - name: Read recovery attempt ledger
        id: ledger
        if: steps.monitor.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: FPF sync recovery stalled (upstream ${{ steps.monitor.outputs.upstream_short_ref }})
        run: |
          set -euo pipefail

          issue_json="$(
            gh issue list \
              --state open \
              --search "$TITLE in:title" \
              --json number,body \
              --jq '.[0] // empty'
          )"

          issue_number=""
          attempts="0"
          if [ -n "$issue_json" ]; then
            issue_number="$(jq -r '.number' <<<"$issue_json")"
            body="$(jq -r '.body // ""' <<<"$issue_json")"
            parsed="$(sed -n 's/.*<!-- fpf-sync-attempts:\([0-9][0-9]*\) -->.*/\1/p' <<<"$body" | head -n 1)"
            if [ -n "$parsed" ]; then
              attempts="$parsed"
            fi
          fi

          {
            echo "issue_number=$issue_number"
            echo "attempts=$attempts"
          } >> "$GITHUB_OUTPUT"
          echo "Recovery ledger: issue=${issue_number:-none} attempts=$attempts"

      - name: Trigger guarded publication sync
        if: steps.monitor.outputs.needs_sync == 'true' && steps.active_sync_worker.outputs.active != 'true' && fromJSON(steps.ledger.outputs.attempts || '0') < 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF: ${{ steps.monitor.outputs.upstream_ref }}
        run: gh workflow run sync-fpf.yml --ref main -f upstream_ref="$UPSTREAM_REF"

      - name: Record recovery attempt
        id: record
        if: steps.monitor.outputs.needs_sync == 'true' && steps.active_sync_worker.outputs.active != 'true' && fromJSON(steps.ledger.outputs.attempts || '0') < 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: FPF sync recovery stalled (upstream ${{ steps.monitor.outputs.upstream_short_ref }})
          ISSUE_NUMBER: ${{ steps.ledger.outputs.issue_number }}
          ATTEMPTS: ${{ steps.ledger.outputs.attempts }}
          UPSTREAM_REF: ${{ steps.monitor.outputs.upstream_ref }}
          PUBLISHED_REF: ${{ steps.monitor.outputs.published_ref }}
          DRIFT_HOURS: ${{ steps.monitor.outputs.drift_hours }}
          MAX_DRIFT_HOURS: ${{ steps.monitor.outputs.max_drift_hours }}
          SUMMARY: ${{ steps.monitor.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          next=$(( ${ATTEMPTS:-0} + 1 ))
          body_file="$(mktemp)"
          {
            printf '%s\n' \
              "<!-- fpf-sync-attempts:$next -->" \
              'The sync freshness monitor found production behind upstream and dispatched the sync worker.' \
              '' \
              "- Upstream ref: $UPSTREAM_REF" \
              "- Published ref: ${PUBLISHED_REF:-unknown}" \
              "- Drift: ${DRIFT_HOURS:-unknown}h (limit ${MAX_DRIFT_HOURS:-unknown}h)" \
              "- Monitor summary: ${SUMMARY:-n/a}" \
              "- Recovery dispatches for this ref: $next" \
              "- Dispatched at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "- Run: $RUN_URL" \
              '' \
              'This ledger tracks automatic recovery dispatches for this upstream ref. After 2 dispatches without recovery the monitor stops re-dispatching and escalates here instead of retrying forever.'
          } > "$body_file"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file "$body_file"
          else
            gh issue create --title "$TITLE" --body-file "$body_file"
          fi

      - name: Escalate stalled recovery
        id: escalate
        if: steps.monitor.outputs.needs_sync == 'true' && steps.active_sync_worker.outputs.active != 'true' && fromJSON(steps.ledger.outputs.attempts || '0') >= 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.ledger.outputs.issue_number }}
          UPSTREAM_REF: ${{ steps.monitor.outputs.upstream_ref }}
          SUMMARY: ${{ steps.monitor.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$(printf '%s\n' \
              "2 recovery dispatches for $UPSTREAM_REF did not restore freshness; halting automatic re-dispatch, manual investigation required." \
              '' \
              "- Monitor summary: ${SUMMARY:-n/a}" \
              "- Run: $RUN_URL")"
          fi
          echo "::error::FPF sync recovery is stalled for upstream $UPSTREAM_REF after 2 dispatches; halting automatic re-dispatch — manual investigation required."
          exit 1

      - name: Close recovery ledger when fresh
        if: steps.monitor.outputs.needs_sync != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Close every open ledger, not just the current ref's: after a ref
          # rollover the stale-ref ledger would otherwise stay open forever.
          gh issue list \
            --state open \
            --search '"FPF sync recovery stalled" in:title' \
            --json number \
            --jq '.[].number' |
          while read -r number; do
            [ -n "$number" ] || continue
            gh issue comment "$number" --body "Production is fresh again; closing the recovery ledger. Run: $RUN_URL"
            gh issue close "$number" --reason completed
          done

      - name: Enforce sync SLO
        if: steps.monitor.outputs.breached == 'true'
        run: |
          echo "::error::${{ steps.monitor.outputs.summary }}"
          exit 1

      # CR-3: any red monitor run must leave a durable, deduplicated trail —
      # not only the stalled-recovery branch. This catches the paths the
      # branches above miss: a crash of the health evaluation itself (every
      # later step skips), a breach with no pending upstream sync
      # (breached && !needs_sync — e.g. hosted runtime incoherent), and a
      # breach suppressed by an already-active worker run. Runs where the
      # per-ref ledger was updated this run (record) or the stalled-recovery
      # escalation fired (escalate) are excluded — those already own an issue.
      - name: Open or update monitor failure issue
        if: ${{ failure() && steps.record.outcome != 'success' && steps.escalate.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit repo: this step must work even when checkout itself
          # failed and the workspace has no git remote for gh to infer from.
          GH_REPO: ${{ github.repository }}
          TITLE: Investigate FPF sync monitor failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          NEEDS_SYNC: ${{ steps.monitor.outputs.needs_sync }}
          BREACHED: ${{ steps.monitor.outputs.breached }}
          DRIFT_HOURS: ${{ steps.monitor.outputs.drift_hours }}
          MAX_DRIFT_HOURS: ${{ steps.monitor.outputs.max_drift_hours }}
          SUMMARY: ${{ steps.monitor.outputs.summary }}
        run: |
          set -euo pipefail

          existing="$(
            gh issue list \
              --state open \
              --search "$TITLE in:title" \
              --json number \
              --jq '.[0].number // ""'
          )"

          body_file="$(mktemp)"
          {
            printf '%s\n' \
              'The FPF sync monitor run went red without an existing escalation path covering it; the freshness sentinel is not doing its job until this is resolved.' \
              '' \
              "- Health evaluation (monitor:sync): ${MONITOR_OUTCOME:-skipped}" \
              "- needs_sync: ${NEEDS_SYNC:-unknown}" \
              "- SLO breached: ${BREACHED:-unknown}" \
              "- Drift: ${DRIFT_HOURS:-unknown}h (limit ${MAX_DRIFT_HOURS:-unknown}h)" \
              "- Monitor summary: ${SUMMARY:-n/a}" \
              "- Run: $RUN_URL"
            if [ "${MONITOR_OUTCOME:-skipped}" != "success" ]; then
              printf '%s\n' '- The health evaluation itself did not complete (setup or evaluation crash); see the run log.'
            fi
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
          else
            gh issue create --title "$TITLE" --body-file "$body_file"
          fi

      - name: Close monitor failure issue after green run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: Investigate FPF sync monitor failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(
            gh issue list \
              --state open \
              --search "$TITLE in:title" \
              --json number \
              --jq '.[0].number // ""'
          )"

          if [ -z "$existing" ]; then
            exit 0
          fi

          gh issue comment "$existing" --body "The sync monitor completed a clean run; closing. Run: $RUN_URL"
          gh issue close "$existing" --reason completed
