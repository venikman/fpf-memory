name: FPF Sync Monitor

on:
  schedule:
    # Daily sentinel, offset from the worker's 05:17/17:17 slots. sync-fpf.yml
    # runs on its own schedule and completes the whole sync in one run; this
    # workflow is the independent SLO alarm and re-dispatches the worker if a
    # scheduled sync failed or never ran.
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      max_drift_hours:
        description: 'Allowed upstream-to-mcp.fpf.sh drift before this monitor fails'
        required: false
        default: '26'

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: fpf-sync-monitor
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.5'
  FPF_SYNC_MONITOR_STATUS_URL: https://mcp.fpf.sh/api/fpf/status
  # 26h = the "≤1 day behind" promise plus build/deploy slack. With twice-daily
  # worker slots the normal worst case is ~13h, so a breach means the worker is
  # actually broken, not merely scheduled later.
  FPF_SYNC_MONITOR_MAX_DRIFT_HOURS: ${{ github.event.inputs.max_drift_hours || '26' }}

jobs:
  monitor:
    name: Check mcp.fpf.sh sync SLO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Evaluate hosted sync health
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run monitor:sync -- --format markdown

      - name: Check for existing target sync PR
        id: open_sync_pr
        if: steps.monitor.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          TARGET_BRANCH: chore/sync-fpf-${{ steps.monitor.outputs.upstream_short_ref }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(
            gh pr list \
              --state open \
              --head "$TARGET_BRANCH" \
              --json number,author,baseRefName,body,headRepositoryOwner,isCrossRepository |
            jq -r --arg owner "$REPO_OWNER" '
              [
                .[]
                | select(.baseRefName == "main")
                | select(.isCrossRepository == false)
                | select(.headRepositoryOwner.login == $owner)
                | select(.author.login == "app/github-actions")
                | select((.body // "") | contains("Generated by `.github/workflows/sync-fpf.yml`."))
              ]
              | first
              | .number // empty
            '
          )"

          if [ -n "$PR_NUMBER" ]; then
            echo "target_exists=true" >> "$GITHUB_OUTPUT"
            echo "Sync PR #$PR_NUMBER already exists for $TARGET_BRANCH; a worker retry can recheck merge eligibility."
          else
            echo "target_exists=false" >> "$GITHUB_OUTPUT"
            echo "No automation-owned open sync PR exists for $TARGET_BRANCH."
          fi

      - name: Check for active sync worker
        id: active_sync_worker
        if: steps.monitor.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ACTIVE_RUN="$(
            gh run list \
              --workflow sync-fpf.yml \
              --limit 20 \
              --json databaseId,status,url |
            jq -r '
              [
                .[]
                | select(
                  .status == "queued"
                  or .status == "in_progress"
                  or .status == "waiting"
                  or .status == "pending"
                  or .status == "requested"
                )
              ]
              | first
              | if . == null then "" else "\(.databaseId)\t\(.status)\t\(.url)" end
            '
          )"

          if [ -n "$ACTIVE_RUN" ]; then
            IFS=$'\t' read -r run_id run_status run_url <<< "$ACTIVE_RUN"
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Sync worker run $run_id is $run_status: $run_url"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No active sync worker run found; dispatch can open or retry the current sync PR."
          fi

      # No `if:` — this must run on every monitor run so the close path below
      # can fire when production is current again.
      - name: Measure recovery-dispatch budget
        id: recovery_budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_FAILED_RECOVERIES: '3'
        run: |
          set -euo pipefail

          # Fail open: a transient API 5xx must not silently suppress the
          # recovery dispatch this step guards.
          fail_open() {
            echo "::warning::$1; failing open and allowing a dispatch."
            echo "failed_streak=0" >> "$GITHUB_OUTPUT"
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Two server-filtered queries instead of one 100-run page. The
          # single page held ~4-5 weeks at 2+ runs/day, so in any longer
          # outage the last-success anchor and then the counted failed
          # dispatches scrolled out of the window: FAILED_STREAK spuriously
          # dropped, the escalation issue auto-closed with a false "retries
          # resumed" comment, and the budget re-armed for 3 more doomed
          # dispatches — repeating every few weeks for as long as the outage
          # lasted.

          # Reset anchor: the newest sync-fpf run of ANY event/actor that
          # succeeded. Anchoring to the bot-dispatch stream instead would be a
          # one-way latch — this workflow is its only producer, so once
          # dispatch stops the streak could never fall. status=success keeps
          # the page tiny however long the history grows; the newest success
          # is on this first page, and the client-side sort stays as a guard
          # against within-page ordering surprises.
          SUCCESSES="$(gh api "repos/${{ github.repository }}/actions/workflows/sync-fpf.yml/runs?status=success&per_page=100" || true)"
          if [ -z "$SUCCESSES" ] || ! jq -e .workflow_runs >/dev/null 2>&1 <<<"$SUCCESSES"; then
            fail_open "Could not read sync-fpf success history"
          fi
          LAST_SUCCESS="$(jq -r '
            [.workflow_runs[].created_at] | sort | last // ""
          ' <<<"$SUCCESSES")"

          # Count only automated recovery dispatches since that success. The
          # event+actor filter matters: without it the two daily SCHEDULED
          # worker failures would burn the budget within a day and the monitor
          # would never retry at all. event+status are filtered server-side
          # and --paginate walks every remaining page, so the count covers the
          # TRUE history since the anchor; `created` narrows the walk to the
          # anchor's day onward (search-qualifier syntax is only reliable at
          # date granularity — the exact timestamp cut stays in jq below).
          QUERY="event=workflow_dispatch&status=failure&per_page=100"
          if [ -n "$LAST_SUCCESS" ]; then
            QUERY="$QUERY&created=%3E%3D${LAST_SUCCESS%%T*}"
          fi
          FAILED_PAGES="$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/sync-fpf.yml/runs?$QUERY" || true)"
          if [ -z "$FAILED_PAGES" ]; then
            fail_open "Could not read sync-fpf dispatch-failure history"
          fi
          # --paginate concatenates page objects; jq -s folds them into one
          # array before counting.
          FAILED_STREAK="$(jq -s -r --arg since "$LAST_SUCCESS" '
            [ .[].workflow_runs[]
              | select(.triggering_actor.login == "github-actions[bot]")
              | select($since == "" or .created_at > $since)
            ] | length
          ' <<<"$FAILED_PAGES" 2>/dev/null || true)"
          case "$FAILED_STREAK" in
            ''|*[!0-9]*) fail_open "Dispatch-failure history did not parse" ;;
          esac

          echo "failed_streak=$FAILED_STREAK" >> "$GITHUB_OUTPUT"
          echo "last_success=$LAST_SUCCESS" >> "$GITHUB_OUTPUT"
          if [ "$FAILED_STREAK" -ge "$MAX_FAILED_RECOVERIES" ]; then
            echo "exhausted=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$FAILED_STREAK automated recovery dispatches of sync-fpf.yml have failed since the last successful worker run ($LAST_SUCCESS); not dispatching again until one succeeds."
          else
            echo "exhausted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger guarded publication sync
        if: steps.monitor.outputs.needs_sync == 'true' && steps.active_sync_worker.outputs.active != 'true' && steps.recovery_budget.outputs.exhausted != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REF: ${{ steps.monitor.outputs.upstream_ref }}
        run: gh workflow run sync-fpf.yml --ref main -f upstream_ref="$UPSTREAM_REF"

      # Gated on the budget, not on `breached`: a breach-gated escalation would
      # have been inert for the whole outage, because the drift bug kept every
      # run green.
      - name: Escalate exhausted recovery budget
        if: steps.recovery_budget.outputs.exhausted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: FPF sync recovery is stuck — automated retries stopped
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM_REF: ${{ steps.monitor.outputs.upstream_ref }}
          PUBLISHED_REF: ${{ steps.monitor.outputs.published_ref }}
          DRIFT_HOURS: ${{ steps.monitor.outputs.drift_hours }}
          FRESHNESS_BASIS: ${{ steps.monitor.outputs.freshness_basis }}
          EVIDENCE_URL: ${{ steps.monitor.outputs.evidence_url }}
          FAILED_STREAK: ${{ steps.recovery_budget.outputs.failed_streak }}
          LAST_SUCCESS: ${{ steps.recovery_budget.outputs.last_success }}
          SUMMARY: ${{ steps.monitor.outputs.summary }}
        run: |
          set -euo pipefail

          existing="$(
            gh issue list --state open --limit 100 --json number,title |
            jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // ""'
          )"

          body_file="$(mktemp)"
          {
            printf '%s\n' \
              'Automated re-dispatch of `sync-fpf.yml` is suspended: consecutive recovery attempts failed.' \
              '' \
              "- Failed recovery dispatches since the last successful worker run: $FAILED_STREAK" \
              "- Last successful sync-fpf run: $LAST_SUCCESS" \
              "- Published ref: $PUBLISHED_REF" \
              "- Upstream ref: $UPSTREAM_REF" \
              "- Reported drift: ${DRIFT_HOURS}h (basis $FRESHNESS_BASIS)" \
              "- Evidence: $EVIDENCE_URL" \
              "- Monitor summary: $SUMMARY" \
              "- Run: $RUN_URL" \
              '' \
              'Retries resume automatically once ANY `sync-fpf.yml` run succeeds — including its own 05:17/17:17 scheduled slots. Fix the worker before re-dispatching by hand.'
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
          else
            gh issue create --title "$TITLE" --body-file "$body_file"
          fi

      - name: Close recovery-stuck issue once retries resume
        # `== 'false'` explicitly, not `!= 'true'`: an empty value means the
        # budget step did not produce a verdict, which is not proof of recovery.
        if: steps.recovery_budget.outputs.exhausted == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: FPF sync recovery is stuck — automated retries stopped
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(
            gh issue list --state open --limit 100 --json number,title |
            jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // ""'
          )"

          if [ -z "$existing" ]; then
            exit 0
          fi

          gh issue comment "$existing" --body "A sync-fpf run has succeeded; the recovery-dispatch budget has reset and automated retries have resumed. Run: $RUN_URL"
          gh issue close "$existing" --reason completed

      - name: Enforce sync SLO
        # Also fails when the recovery budget is exhausted: without that the
        # monitor stays green while it has silently stopped trying to recover —
        # the exact bug class that let 34 failures pass unnoticed.
        if: steps.monitor.outputs.breached == 'true' || steps.recovery_budget.outputs.exhausted == 'true'
        run: |
          echo "::error::${{ steps.monitor.outputs.summary }}"
          exit 1
