name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs share a group per PR number so a follow-up commit cancels the prior
  # run. Pushes to `main` use the SHA so every commit gets its own group —
  # otherwise GitHub's per-group queue (only one pending run is kept) would
  # silently discard intermediate `main` commits when they land faster than
  # CI can start, even with `cancel-in-progress: false`.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single source of truth for the bun toolchain version. Used by setup-bun
  # in every job and baked into the cache key so a version bump invalidates
  # incompatible node_modules caches.
  BUN_VERSION: '1.3.5'
  VERCEL_MCP_FUNCTION_BUNDLE_PATH: .vercel/output/functions/_mcp.func

jobs:
  setup:
    name: Install + validate published
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - id: cache-key
        # Include the bun version + runner arch so toolchain bumps and
        # cross-arch runners don't restore an incompatible node_modules.
        run: echo "key=bun-${{ env.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ steps.cache-key.outputs.key }}

      - run: bun install --frozen-lockfile

      - name: Ensure published snapshot
        # published/current/fpf-index/snapshot.json is a 95MB build product,
        # regenerated here instead of committed. Hermetic: no network.
        run: bun run ensure:snapshot

      - name: Assert ensure did not rewrite the committed surface
        # ensure:snapshot rewrites the spec + manifest as a side effect. If
        # either actually changed, the committed surface is stale (typically a
        # compiler-fingerprint input moved) and the push must be re-published
        # with `bun run publish:current`, not silently patched in CI.
        run: git diff --exit-code -- published/current/FPF-Spec.md published/current/manifest.json

      - name: Validate published/current coherence
        # The publication surface is owned by the local pre-push hook and
        # the Sync FPF Publication workflow. CI regenerates only the snapshot
        # (a build product); the committed spec + manifest are asserted
        # unchanged by the step above. If the committed tree is missing or
        # internally inconsistent, fail here so the broken push doesn't reach
        # the deploy jobs.
        run: bun run validate:published

      - name: Monitor generated and curated content quality
        # Validate the committed publication projection before build jobs.
        # This catches stale route selectors in curated pages and route catalog
        # holes against the same published snapshot the deploy will serve.
        run: bun run monitor:content -- --mode local --format markdown --fail-on-breach

  lint:
    name: Lint + boundaries
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:boundaries

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  test:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    strategy:
      # Surface every failing shard, don't mask 2-4 because shard 1 broke.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: bun install --frozen-lockfile
      # tests/fpf-work-evaluator.test.ts and tests/fpf-spec-runtime.test.ts
      # copyFile the real snapshot from process.cwd(). The shard job invokes
      # scripts/run-test-shard.ts directly, so a `pretest` hook never fires —
      # this step is required.
      - run: bun run ensure:snapshot
      # Run one shard per runner, then split that shard into one Rstest
      # process per file. The full FPF suite includes docs and runtime index
      # builds; keeping each file in a fresh process prevents late-shard worker
      # exits from accumulated test-runner state while preserving failure
      # visibility.
      - name: Run test shard
        run: bun scripts/run-test-shard.ts --shard=${{ matrix.shard }}/4

  build:
    name: Build (docs + MCP + Vercel dry-runs)
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: bun install --frozen-lockfile
      # vercel:mcp:build -> predeploy -> stage:from-published and
      # smoke:production --local both call validatePublishedSurface, which
      # hard-fails without the snapshot.
      - run: bun run ensure:snapshot
      - run: bun run build:mcp
      - name: Build website Vercel output without uploading
        # Assemble the Vercel Build Output API bundle without uploading.
        # Catches packaging regressions on every PR without requiring
        # deploy credentials.
        run: |
          bun run vercel:website:build
          test -f .vercel/output/static/index.html
          test -f .vercel/output/static/fpf-publication-manifest.json
          test -f .vercel/output/static/start-here.html
          test -f .vercel/output/static/generated/patterns/A.6.9.html
          test ! -d .vercel/output/functions
          # Preserve website output before the MCP build overwrites .vercel/output.
          # The preview job deploys this GitHub-built artifact instead of asking
          # Vercel's 8GB Git builder to re-run docs:build (OOM / SIGKILL 137).
          mkdir -p "$RUNNER_TEMP/fpf-website-vercel-output"
          cp -a .vercel/output "$RUNNER_TEMP/fpf-website-vercel-output/output"

      - name: Upload website prebuilt output for preview deploy
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-vercel-output
          path: ${{ runner.temp }}/fpf-website-vercel-output/output
          retention-days: 1

      - name: Build MCP Vercel output without uploading
        # MCP/API deploys from a separate Vercel project and should not carry
        # the static docs tree in its serverless bundle. The only static
        # asset is the legacy-route 410 migration body; anything else means
        # the docs tree leaked into the MCP deployment.
        run: |
          bun run vercel:mcp:build
          test -d "$VERCEL_MCP_FUNCTION_BUNDLE_PATH"
          test -f "$VERCEL_MCP_FUNCTION_BUNDLE_PATH/index.mjs"
          test -f "$VERCEL_MCP_FUNCTION_BUNDLE_PATH/hosted/FPF-Spec.md"
          test -f "$VERCEL_MCP_FUNCTION_BUNDLE_PATH/hosted/manifest.json"
          test -f "$VERCEL_MCP_FUNCTION_BUNDLE_PATH/hosted/fpf-index/snapshot.json"
          test -f .vercel/output/static/legacy-mcp-gone.json
          test "$(ls -A .vercel/output/static)" = "legacy-mcp-gone.json"

      - name: Run semantic production smoke against local build
        # Exercise the same semantic assertions used for production against
        # local docs + hosted MCP surfaces. This catches name, route, status,
        # and standalone GET drift without depending on live production from
        # pull-request CI.
        run: bun run smoke:production -- --local --format markdown --fail-on-breach


  preview:
    name: Preview (GitHub-prebuilt Vercel + Playwright)
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ needs.setup.outputs.cache-key }}
      - run: bun install --frozen-lockfile

      - name: Download GitHub-built website output
        uses: actions/download-artifact@v4
        with:
          name: website-vercel-output
          path: .vercel/output

      - name: Deploy prebuilt website preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FPF_VERCEL_SCOPE: venikmans-projects
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured; cannot deploy a GitHub-prebuilt website preview."
            exit 1
          fi
          test -f .vercel/output/static/index.html
          bun scripts/deploy-vercel-prebuilt.ts --project fpf-sh --config vercel.json

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium for Playwright
        run: bun run test:e2e:install

      - name: Run Playwright against the GitHub-prebuilt preview
        env:
          FPF_E2E_BASE_URL: ${{ steps.preview.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${FPF_E2E_BASE_URL:-}" ]; then
            echo "::error::Preview deploy did not emit deployment_url."
            exit 1
          fi
          bunx playwright test \
            tests/e2e/rendering.spec.ts \
            tests/e2e/routes.spec.ts \
            tests/e2e/head-shape.spec.ts \
            tests/e2e/keybindings.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-github-preview
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

  # Single green check for branch protection: this is the only required
  # status. It goes green iff every parallel job above succeeded. The job
  # ID stays `ci` (no `name:` override) so the status-check context
  # remains `CI / ci`, matching existing branch-protection rules.
  ci:
    runs-on: ubuntu-latest
    needs: [setup, lint, typecheck, test, build]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        # Require every dependency result to be exactly `success`. Checking
        # only for `failure`/`cancelled` would let a `skipped` result slip
        # through as green if a future change adds an `if:` to a job.
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Required job results: $results"
          IFS=','
          for r in $results; do
            if [[ "$r" != "success" ]]; then
              echo "::error::A required job did not succeed (got: '$r')."
              exit 1
            fi
          done
