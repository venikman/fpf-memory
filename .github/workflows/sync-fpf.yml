name: Sync FPF Publication

# Tracks the original FPF spec at github.com/ailev/FPF. This is the publication
# worker. `fpf-sync-monitor.yml` is the scheduled freshness sentinel;
# repository_dispatch is available for any upstream notifier that can send
# `fpf-origin-updated`. If the resolved upstream ref
# differs from `published/current/manifest.json`, this workflow rebuilds the
# snapshot, opens a PR, waits in-run for the CI pipeline to gate it, merges
# once every reported check/status is passing, and deploys the website and MCP
# production bundles through the repo CLI scripts so both Vercel surfaces are
# tied to the merged commit — one run completes the whole loop.
#
# Earlier versions auto-pushed to main; that was changed to PR mode
# because upstream-spec changes are higher-risk than human PRs (no
# author review, content can change parser behavior). PR mode keeps
# the same E2E gates that protect every other change to main. A two-hour
# human review window used to sit between PR and merge; it was dropped when
# the pipeline moved from hourly rechecks to a daily cadence (waiting a day
# per recheck made production chronically stale) — CI is the gate.
on:
  schedule:
    # Two daily slots so an upstream commit is never more than ~12h from
    # production (the freshness promise is ≤1 day). A scheduled run with no
    # upstream change exits in about a minute.
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'
  repository_dispatch:
    types: [fpf-origin-updated, fpf-sync-updated]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'ailev/FPF branch, tag, or commit SHA to publish'
        required: false
        default: ''
      spec_url:
        description: 'Optional raw FPF-Spec.md URL; requires upstream_ref for provenance'
        required: false
        default: ''

permissions:
  actions: write
  contents: write
  pull-requests: write

# A single sync at a time. If a manual or monitor-triggered run overlaps
# another sync, the later run waits so two jobs do not race on `published/current/`.
concurrency:
  group: sync-fpf
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.5'
  FPF_UPSTREAM_OWNER: ailev
  FPF_UPSTREAM_REPO: FPF
  FPF_UPSTREAM_SPEC_PATH: FPF-Spec.md
  VERCEL_MCP_FUNCTION_BUNDLE_PATH: .vercel/output/functions/_mcp.func

jobs:
  refresh:
    name: Refresh published/current from ailev/FPF
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Resolve upstream input
        id: upstream
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha || github.event.client_payload.after || '' }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref || github.event.client_payload.branch || '' }}
          PAYLOAD_SPEC_URL: ${{ github.event.client_payload.spec_url || '' }}
          MANUAL_REF: ${{ github.event.inputs.upstream_ref || '' }}
          MANUAL_SPEC_URL: ${{ github.event.inputs.spec_url || '' }}
        run: |
          set -euo pipefail

          UPSTREAM_REF="${PAYLOAD_SHA:-${PAYLOAD_REF:-$MANUAL_REF}}"
          SPEC_URL="${PAYLOAD_SPEC_URL:-$MANUAL_SPEC_URL}"

          if [ -n "$SPEC_URL" ] && [ -z "$UPSTREAM_REF" ]; then
            echo "::error::spec_url requires client_payload.sha/after/ref/branch or manual upstream_ref so manifest provenance is verifiable."
            exit 1
          fi

          if [ -z "$UPSTREAM_REF" ]; then
            UPSTREAM_REF="main"
          fi
          UPSTREAM_REF="${UPSTREAM_REF#refs/heads/}"
          UPSTREAM_REF="${UPSTREAM_REF#refs/tags/}"

          {
            echo "ref=$UPSTREAM_REF"
            echo "spec_url=$SPEC_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Download upstream spec from ailev/FPF
        env:
          FPF_UPSTREAM_REF: ${{ steps.upstream.outputs.ref }}
          FPF_UPSTREAM_SPEC_URL: ${{ steps.upstream.outputs.spec_url }}
        run: bun run spec:download

      - name: Publish current channel
        env:
          FPF_PUBLISH_SOURCE_PATH: .fpf-upstream/FPF-Spec.md
          FPF_UPSTREAM_REF: ${{ steps.upstream.outputs.ref }}
          # Resolving the upstream commit hits api.github.com. Unauthenticated
          # it is 60 req/hour per IP and runners share egress addresses, so the
          # call 403s on a busy runner even for a public repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run publish:current

      - name: Assert per-section blame survived the publish
        # publish:current clones ailev/FPF and `git blame`s the spec to stamp
        # every indexMap node with lastCommittedAt/lastCommitSha. Both failure
        # arms in upstream-blame.ts return undefined and publish-current skips
        # enrichment silently — validate:published cannot see it, and the only
        # symptom is fpf.sh losing every per-section "Last Updated" date.
        # The snapshot is untracked now, so this worktree copy is the ONLY
        # blame-bearing artifact the later deploy:prod steps can ship.
        run: |
          set -euo pipefail
          test -f published/current/fpf-index/snapshot.json
          STAMPS=$(grep -c '"lastCommittedAt"' published/current/fpf-index/snapshot.json)
          echo "per-section blame stamps: $STAMPS"
          test "$STAMPS" -gt 1000

      - name: Validate published surface
        run: bun run validate:published

      - name: Build website and hosted MCP deployment bundles
        run: |
          bun run vercel:website:build
          test -f .vercel/output/static/index.html
          test -f .vercel/output/static/fpf-publication-manifest.json
          test -f .vercel/output/static/generated/patterns/A.6.9.html
          test ! -d .vercel/output/functions

          bun run vercel:mcp:build
          test -d "$VERCEL_MCP_FUNCTION_BUNDLE_PATH"
          test -f "$VERCEL_MCP_FUNCTION_BUNDLE_PATH/index.mjs"
          test -f "$VERCEL_MCP_FUNCTION_BUNDLE_PATH/hosted/FPF-Spec.md"
          test -f "$VERCEL_MCP_FUNCTION_BUNDLE_PATH/hosted/manifest.json"
          test -f "$VERCEL_MCP_FUNCTION_BUNDLE_PATH/hosted/fpf-index/snapshot.json"
          test -f .vercel/output/static/legacy-mcp-gone.json
          test "$(ls -A .vercel/output/static)" = "legacy-mcp-gone.json"

      - name: Detect upstream change
        id: detect
        run: |
          set -euo pipefail
          # Stage the publication surface; if nothing changed,
          # the rest of the steps can short-circuit.
          git add published/current/FPF-Spec.md \
                  published/current/manifest.json \
                  src/docs/generated-search-id-registry.ts

          if git diff --cached --quiet; then
            echo "published/current already represents ailev/FPF ${{ steps.upstream.outputs.ref }}; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            UPSTREAM_REF=$(jq -r .upstreamRef published/current/manifest.json)
            {
              echo "upstream_ref=$UPSTREAM_REF"
              echo "short_ref=${UPSTREAM_REF:0:8}"
            } >> "$GITHUB_OUTPUT"
            git reset HEAD -- . || true
            exit 0
          fi

          UPSTREAM_REF=$(jq -r .upstreamRef published/current/manifest.json)
          UPSTREAM_REPO_URL=$(jq -r .upstreamRepoUrl published/current/manifest.json)
          UPSTREAM_REPO_LABEL="${UPSTREAM_REPO_URL#https://github.com/}"
          UPSTREAM_DATE=$(jq -r .upstreamCommittedAt published/current/manifest.json)
          {
            echo "changed=true"
            echo "upstream_ref=$UPSTREAM_REF"
            echo "upstream_repo_url=$UPSTREAM_REPO_URL"
            echo "upstream_repo_label=$UPSTREAM_REPO_LABEL"
            echo "short_ref=${UPSTREAM_REF:0:8}"
            echo "short_date=${UPSTREAM_DATE:0:10}"
          } >> "$GITHUB_OUTPUT"

          # Reset the staged files so peter-evans/create-pull-request
          # can stage + commit on its own branch.
          git reset HEAD -- .

      - name: Repair production deploy when published/current is already current
        if: steps.detect.outputs.changed == 'false' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FPF_VERCEL_SCOPE: team_CnO1I5xd2OS0lzbbc4RkW7Ym
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN is not configured; cannot repair production deployment from no-change sync run."
            exit 0
          fi

          SYNC_OK=false
          CONTENT_OK=false
          if bun run monitor:sync -- --format markdown --fail-on-breach; then
            SYNC_OK=true
          fi
          if bun run monitor:content -- --mode live --format markdown --fail-on-breach; then
            CONTENT_OK=true
          fi

          if [ "$SYNC_OK" = "true" ] && [ "$CONTENT_OK" = "true" ]; then
            echo "Production website and MCP status are coherent for the current published surface; no repair deploy needed."
            exit 0
          fi

          echo "::warning::Production monitor failed while published/current has no upstream diff; redeploying website and MCP surfaces."
          # deploy:prod ships the untracked snapshot left in this worktree by
          # the "Publish current channel" step (git checkout/pull preserve
          # untracked ignored files). Do NOT insert `git clean -fdx`, a second
          # actions/checkout, or a job split here, and do NOT substitute
          # `ensure:snapshot` — it is blame-free by design and would ship
          # dateless docs to production.
          bun run deploy:prod
          bun run monitor:sync -- --format markdown --fail-on-breach
          bun run monitor:content -- --mode live --format markdown --fail-on-breach

      - name: Close superseded sync PRs
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          TARGET_BRANCH: chore/sync-fpf-${{ steps.detect.outputs.short_ref }}
        run: |
          set -euo pipefail

          gh pr list \
            --state open \
            --json number,author,baseRefName,body,headRefName,headRepositoryOwner,isCrossRepository,url |
          jq -r --arg owner "$REPO_OWNER" --arg target "$TARGET_BRANCH" '
            .[]
            | select(.headRefName | startswith("chore/sync-fpf-"))
            | select(.headRefName != $target)
            | select(.baseRefName == "main")
            | select(.isCrossRepository == false)
            | select(.headRepositoryOwner.login == $owner)
            | select(.author.login == "app/github-actions")
            | select((.body // "") | contains("Generated by `.github/workflows/sync-fpf.yml`."))
            | [.number, .headRefName, .url]
            | @tsv
          ' |
          while IFS=$'\t' read -r number head_ref url; do
            if [ -z "$number" ]; then
              continue
            fi

            COMMENT="Closing as superseded by the current publication sync target \`$TARGET_BRANCH\`."

            echo "Closing superseded sync PR $url ($head_ref)."
            if ! gh pr close "$number" --comment "$COMMENT"; then
              echo "::warning::Failed to close superseded sync PR $url."
            fi
          done

      - name: Open sync PR
        if: steps.detect.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-fpf-${{ steps.detect.outputs.short_ref }}
          delete-branch: true
          base: main
          commit-message: |
            publish: sync FPF spec from ${{ steps.detect.outputs.upstream_repo_label }} (${{ steps.detect.outputs.short_ref }} · ${{ steps.detect.outputs.short_date }})
          title: 'chore: sync FPF spec from ${{ steps.detect.outputs.upstream_repo_label }} (${{ steps.detect.outputs.short_date }})'
          body: |
            Auto-detected new commit on `${{ steps.detect.outputs.upstream_repo_label }}`.

            - **Upstream commit**: [`${{ steps.detect.outputs.upstream_ref }}`](${{ steps.detect.outputs.upstream_repo_url }}/commit/${{ steps.detect.outputs.upstream_ref }})
            - **Author date**: ${{ steps.detect.outputs.short_date }}

            CI gates this merge: lint, type, tests, website/MCP deployment dry-runs, Vercel preview deploy, and Playwright E2E. The sync workflow waits for these checks in-run and merges this PR automatically once every reported check/status is passing.

            > Generated by `.github/workflows/sync-fpf.yml`. Failed or still-pending checks leave this PR open for manual review.
          add-paths: |
            published/current/FPF-Spec.md
            published/current/manifest.json
            src/docs/generated-search-id-registry.ts
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'

      - name: Trigger CI for sync PR branch
        if: steps.detect.outputs.changed == 'true' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: chore/sync-fpf-${{ steps.detect.outputs.short_ref }}
        run: gh workflow run ci.yml --ref "$SYNC_BRANCH"

      - name: Merge sync PR once checks settle
        if: steps.detect.outputs.changed == 'true' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FPF_VERCEL_SCOPE: team_CnO1I5xd2OS0lzbbc4RkW7Ym
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured; cannot merge sync PR #$PR_NUMBER because production deployment cannot be proven."
            exit 1
          fi

          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "Sync PR #$PR_NUMBER is $PR_STATE; nothing to merge."
            exit 0
          fi

          PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)

          # The CI run was dispatched moments ago and the Vercel preview +
          # Playwright checks arrive on their own schedule, so poll until every
          # reported check settles rather than exiting and waiting a day for
          # the next scheduled recheck.
          #
          # `gh pr checks` reads the PR's statusCheckRollup, which never
          # includes check runs from workflow_dispatch-triggered workflows —
          # and that is exactly how this workflow runs CI, because a
          # GITHUB_TOKEN-created PR cannot trigger pull_request events. Union
          # the rollup (Vercel app checks + commit statuses) with the commit's
          # REST check runs (where the dispatched CI reports); on a name
          # collision the REST entry wins because the check-runs API returns
          # the latest run per check.
          REQUIRED_CHECK_NAMES='["Build (docs + MCP + Vercel dry-runs)","Vercel","Playwright on Vercel preview"]'
          DEADLINE=$(( $(date -u +%s) + 2700 ))
          while :; do
            ROLLUP_CHECKS=$(gh pr checks "$PR_NUMBER" --json name,bucket,state,link || true)
            [ -n "$ROLLUP_CHECKS" ] || ROLLUP_CHECKS='[]'
            REST_CHECKS=$(gh api "repos/${{ github.repository }}/commits/$PR_HEAD_SHA/check-runs?per_page=100" --paginate --jq '
              .check_runs[]
              | {
                  name,
                  started: (.started_at // ""),
                  bucket: (
                    if .status != "completed" then "pending"
                    elif .conclusion == "success" then "pass"
                    elif (.conclusion == "skipped" or .conclusion == "neutral") then "skipping"
                    else "fail"
                    end
                  ),
                  state: (.conclusion // .status),
                  link: .html_url
                }' | jq -s 'sort_by(.started) | group_by(.name) | map(.[-1] | del(.started))')
            CHECKS_JSON=$(jq -n --argjson rollup "$ROLLUP_CHECKS" --argjson rest "$REST_CHECKS" '
              ($rest | map(.name)) as $restNames
              | ($rollup | map(select(.name as $n | ($restNames | index($n)) | not))) + $rest
            ')

            FAILED=$(jq '[.[] | select(.bucket == "fail")]' <<<"$CHECKS_JSON")
            if [ "$(jq 'length' <<<"$FAILED")" -ne 0 ]; then
              echo "::error::PR #$PR_NUMBER has failing checks; leaving it open for manual review."
              jq -r '.[] | "- \(.name): \(.bucket) (\(.state)) \(.link // "")"' <<<"$FAILED"
              exit 1
            fi

            MISSING_REQUIRED=$(jq --argjson required "$REQUIRED_CHECK_NAMES" '
              ($required - [.[] | select(.bucket == "pass") | .name])
            ' <<<"$CHECKS_JSON")
            NOT_READY=$(jq '[.[] | select(.bucket != "pass" and .bucket != "skipping")]' <<<"$CHECKS_JSON")
            if [ "$(jq 'length' <<<"$MISSING_REQUIRED")" -eq 0 ] && [ "$(jq 'length' <<<"$NOT_READY")" -eq 0 ]; then
              echo "All checks settled and required checks pass; merging sync PR #$PR_NUMBER."
              break
            fi

            if [ "$(date -u +%s)" -ge "$DEADLINE" ]; then
              echo "::error::PR #$PR_NUMBER checks did not settle within 45 minutes; leaving it open. The daily fpf-sync-monitor re-dispatches this worker while production is behind."
              jq -r '.[] | "- required missing or not passing: \(.)"' <<<"$MISSING_REQUIRED"
              jq -r '.[] | "- \(.name): \(.bucket) (\(.state)) \(.link // "")"' <<<"$NOT_READY"
              exit 1
            fi

            echo "Waiting for checks on PR #$PR_NUMBER: required-missing=$(jq 'length' <<<"$MISSING_REQUIRED") unsettled=$(jq 'length' <<<"$NOT_READY"); rechecking in 60s."
            sleep 60
          done

          gh pr merge "$PR_NUMBER" --squash --delete-branch
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          bun install --frozen-lockfile
          # deploy:prod ships the untracked snapshot left in this worktree by
          # the "Publish current channel" step (git checkout/pull preserve
          # untracked ignored files). Do NOT insert `git clean -fdx`, a second
          # actions/checkout, or a job split here, and do NOT substitute
          # `ensure:snapshot` — it is blame-free by design and would ship
          # dateless docs to production.
          bun run deploy:prod
          bun run monitor:sync -- --format markdown --fail-on-breach
          bun run monitor:content -- --mode live --format markdown --fail-on-breach

      - name: Report result
        run: |
          if [ "${{ steps.detect.outputs.changed }}" = "true" ]; then
            echo "Opened sync PR #${{ steps.pr.outputs.pull-request-number }}"
            echo "${{ steps.pr.outputs.pull-request-url }}"
          else
            echo "No upstream change detected; nothing to do."
          fi

  escalate:
    name: Escalate sync worker failure
    needs: refresh
    # `== 'failure'`, not `!= 'success'`: the concurrency group
    # (cancel-in-progress: false) routinely cancels a superseded pending run,
    # and a maintainer may cancel a stuck 45-minute merge wait. Neither is a
    # worker failure. A job that exceeds timeout-minutes concludes as
    # `failure`, so the timeout case is still covered.
    if: always() && needs.refresh.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # No checkout: the LFS-era failures died inside actions/checkout, so the
      # escalation must not depend on a working tree. GH_REPO replaces the repo
      # context gh would otherwise infer from the checkout's git remote.
      - name: Open or update sync failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Sync FPF publication worker is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.refresh.result }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Exact-title match, not `--search "$TITLE in:title"`: the search
          # index is eventually consistent and ANDs tokens, so a superset title
          # cross-matches. `gh --jq` cannot take --arg, hence the pipe to jq.
          existing="$(
            gh issue list --state open --limit 100 --json number,title |
            jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // ""'
          )"

          body_file="$(mktemp)"
          {
            printf '%s\n' \
              'The FPF publication sync worker did not complete. Production freshness is at risk while this issue is open.' \
              '' \
              "- Job result: $RESULT" \
              "- Triggered by: $TRIGGER" \
              "- Run: $RUN_URL" \
              '' \
              'Read the failing step in the run log before re-dispatching by hand. `fpf-sync-monitor.yml` stops re-dispatching this worker once its consecutive-failure budget is exhausted.'
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
          else
            gh issue create --title "$TITLE" --body-file "$body_file"
          fi

  resolve:
    name: Close sync failure issue after clean run
    needs: refresh
    # Deliberately NOT restricted to github.event_name == 'schedule' (the
    # source pattern is): a successful manual dispatch is real proof of
    # recovery for this worker.
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close sync failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Sync FPF publication worker is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(
            gh issue list --state open --limit 100 --json number,title |
            jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // ""'
          )"

          if [ -z "$existing" ]; then
            exit 0
          fi

          gh issue comment "$existing" --body "Sync worker completed successfully; closing. Run: $RUN_URL"
          gh issue close "$existing" --reason completed
