name: FPF Content Quality Monitor

on:
  schedule:
    # Separate from the sync freshness sentinel: this checks that production
    # pages still project the published FPF snapshot without stale selectors.
    # Daily is enough — every production deploy already runs the same live
    # checks with --fail-on-breach, so this only catches drift between deploys.
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpf-content-quality
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.5'
  FPF_CONTENT_QUALITY_BASE_URL: https://fpf.sh
  FPF_CONTENT_QUALITY_STATUS_URL: https://mcp.fpf.sh/api/fpf/status

jobs:
  monitor:
    name: Check fpf.sh content quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # lfs: true because monitor:content parses the local published snapshot,
      # which is Git LFS-tracked — without it the checkout leaves a pointer
      # file and the run dies with "snapshot is invalid JSON" (this made the
      # monitor red on every run between 2026-07-03 and 2026-07-13).
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Evaluate hosted generated and curated pages
        run: bun run monitor:content -- --mode live --format markdown --fail-on-breach

      - name: Evaluate semantic production smoke
        run: bun run smoke:production -- --format markdown --fail-on-breach
