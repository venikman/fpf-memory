name: Task
description: A concrete work item — research, refactor, chore, or agent-delegable task
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for actionable work items that aren't bugs or feature requests.
        Tasks can be picked up by humans or AI agents.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be done and what does "done" look like?
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - research / exploration
        - refactor
        - chore (deps, CI, cleanup)
        - docs
        - test coverage
        - other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - src/runtime/ (compiler & query engine)
        - src/mcp/ (MCP tools & contracts)
        - CLI
        - Hono server
        - LM Studio integration
        - Logging & observability
        - Docs (Rspress)
        - .github/ (CI & docs deploy)
        - Cross-cutting
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist or conditions that mark this task as complete.
      placeholder: |
        - [ ] criterion 1
        - [ ] criterion 2
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Measurable impact verification
      description: |
        How will we verify the task is complete and measure its impact? Provide a table with concrete metrics.
        Every metric must be quantifiable — no vague criteria like "works better" or "improved".
      placeholder: |
        | Metric | Before | After (target) | How to measure |
        |--------|--------|----------------|----------------|
        | LOC in target file | 1614 | ≤400 | `wc -l src/runtime/target.ts` |
        | Existing test pass rate | all pass | all pass | `bun run test` |
    validations:
      required: true

  - type: dropdown
    id: agent_delegable
    attributes:
      label: Agent-delegable?
      description: Can an AI agent (Devin, Claude Code, Hermes, Codex, etc.) handle this autonomously?
      options:
        - "yes"
        - "partially — needs human review"
        - "no — requires human judgment"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, constraints, or related issues.
    validations:
      required: false
