name: Feature Request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you'd like and why. Remember this repo is scoped to local FPF-spec.md runtime — no vector database, no remote indexing, no Python.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what becomes possible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include API surface, CLI flags, MCP tool changes, or behavior changes.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - src/runtime/ (compiler & query engine)
        - src/mcp/ (MCP tools & contracts)
        - CLI
        - Hono server
        - LM Studio integration
        - Logging & observability
        - Docs (Rspress)
        - .github/ (CI & docs deploy)
        - Cross-cutting
        - Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Measurable impact verification
      description: |
        How will we verify the feature works and measure its impact? Provide a table with concrete metrics.
        Every metric must be quantifiable — no vague criteria like "works better" or "improved".
      placeholder: |
        | Metric | Before | After (target) | How to measure |
        |--------|--------|----------------|----------------|
        | Total MCP tool definitions | 10 | 12 | `grep -c createTool src/mcp/tools.ts` |
        | Feature test cases added | 0 | ≥5 | `grep -Ec '\b(it|test)\(' tests/feature.test.ts` |
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they're less suitable.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, or references.
    validations:
      required: false
